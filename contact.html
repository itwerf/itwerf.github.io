<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact · ITwerf</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="assets/css/site.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("devfolio-theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "light" ? "light" : "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="prerelease-banner" data-banner>Pre-release BUILD</div>
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span data-site-name>ITwerf</span>
      </a>
      <div class="header-actions" data-chrome-header></div>
    </header>

    <main class="shell-main page">
      <div class="page-intro reveal">
        <h1 data-i18n="contactTitle">Contact</h1>
        <p data-i18n="contactLead">
          Questions, ideas, or need a hand? Reach out - we are happy to help.
        </p>
      </div>

      <div class="contact-card reveal">
        <p data-i18n="contactEmailLabel">Email</p>
        <a
          class="contact-email"
          data-email
          data-email-label
          href="mailto:hello@itwerf.nl"
          >hello@itwerf.nl</a
        >
        <p data-i18n="contactBody">
          Write us about Devfolio, hosting, community support, or collaboration.
          We read every message.
        </p>
        <div class="hero-actions">
          <a class="btn btn-primary" data-email href="mailto:hello@itwerf.nl" data-i18n="contactCta"
            >Send an email</a
          >
          <a
            class="btn btn-ghost"
            data-github
            href="https://github.com/itwerf"
            target="_blank"
            rel="noreferrer"
            data-i18n="footerGithub"
            >GitHub</a
          >
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>© <span data-year></span> <span data-site-name>ITwerf</span></p>
      <div class="footer-links">
        <a href="contact.html" data-i18n="navContact">Contact</a>
        <a
          data-github
          href="https://github.com/itwerf"
          target="_blank"
          rel="noreferrer"
          data-i18n="footerGithub"
          >GitHub</a
        >
      </div>
    </footer>

    <script src="assets/js/site.js"></script>
    <script src="assets/js/contact.js"></script>
  </body>
</html>
